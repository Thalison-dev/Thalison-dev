<svg width="800" height="400" viewBox="0 0 800 400"
     xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient id="background"
                        x1="0%" y1="0%"
                        x2="100%" y2="100%">

            <stop offset="0%" stop-color="#00152E"/>
            <stop offset="50%" stop-color="#0057B8"/>
            <stop offset="100%" stop-color="#00BFFF"/>

        </linearGradient>

        <linearGradient id="shine"
                        x1="0%" y1="0%"
                        x2="100%" y2="0%">

            <stop offset="0%" stop-color="white" stop-opacity="0"/>
            <stop offset="50%" stop-color="white" stop-opacity="0.30"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>

        </linearGradient>

        <filter id="shadow">

            <feDropShadow
                dx="0"
                dy="4"
                stdDeviation="5"
                flood-color="#000000"
                flood-opacity="0.5"/>

        </filter>

    </defs>

    <!-- FUNDO -->

    <rect
        width="800"
        height="400"
        fill="url(#background)"/>

    <!-- BRILHO ANIMADO -->

    <rect
        x="-400"
        y="0"
        width="400"
        height="400"
        fill="url(#shine)">

        <animate
            attributeName="x"
            from="-400"
            to="800"
            dur="4s"
            repeatCount="indefinite"/>

    </rect>

    <!-- TEXTO -->

    <text
        x="400"
        y="190"
        text-anchor="middle"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        font-weight="bold"
        letter-spacing="6"
        filter="url(#shadow)">

        THALISON

    </text>

    <text
        x="400"
        y="260"
        text-anchor="middle"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        font-weight="bold"
        letter-spacing="6"
        filter="url(#shadow)">

        DEV

    </text>

</svg>